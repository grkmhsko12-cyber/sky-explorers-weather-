<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Sky Explorers | Weather & Seasons</title><style>
:root{--ink:#15365e;--soft:#ecf9ff;--blue:#167ac9;--purple:#7143c6}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#b9eafd,#f3f2ff 50%,#fff3d5);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #e35db0;outline-offset:3px}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:1000;font-size:clamp(24px,4vw,40px)}.brand span{filter:drop-shadow(0 3px 1px #fff)}.pill{padding:10px 16px;background:white;border-radius:30px;box-shadow:0 4px 0 #b8dae9;font-weight:bold}.btn{border-radius:22px;padding:15px 22px;background:#fff;color:#12426c;font-weight:900;box-shadow:0 6px 0 #c9e1ec;min-height:54px;transition:transform .12s}.btn:active,.gamecard:active{transform:scale(.96)}.btn.primary{background:#ffbf46;box-shadow:0 6px 0 #de9343}.btn.pink{background:#ffd4ee;box-shadow:0 6px 0 #eaaed2}.btn.blue{background:#c9eeff}.hero{text-align:center;padding:24px 0 16px}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.05;margin:8px auto}.hero p{font-size:clamp(17px,2.4vw,24px);font-weight:750}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px;margin-top:20px}.gamecard{border-radius:30px;background:white;padding:24px;min-height:205px;text-align:left;box-shadow:0 9px 0 #b6dce5;transition:transform .15s;border:3px solid transparent;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:inherit}.gamecard:hover{border-color:#75ceef}.gamecard .emoji{font-size:55px}.gamecard strong{font-size:23px}.gamecard small{font-size:16px;line-height:1.4;font-weight:650}.pane{background:rgba(255,255,255,.91);border:3px solid #fff;border-radius:34px;padding:clamp(16px,4vw,35px);box-shadow:0 10px 0 #c4e5ec;text-align:center;margin-top:20px;min-height:500px}.pane h2{font-size:clamp(28px,5vw,42px);margin:5px 0 6px}.instructions{font-size:clamp(18px,2.9vw,26px);font-weight:850;margin:8px auto 18px}.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:18px 0}.scene{background:linear-gradient(#b9e8ff,#effaff);border-radius:28px;overflow:hidden;position:relative;min-height:270px;border:5px solid #fff;box-shadow:inset 0 -9px #b2ddba;margin:auto}.stars{font-size:28px}.mega{font-size:clamp(58px,12vw,140px);line-height:1.2}.celebrate{font-weight:900;color:#a22994;font-size:clamp(23px,4vw,38px);animation:pop .55s ease}.hint{opacity:.8;font-size:16px;font-weight:700}.brush{min-width:94px;min-height:82px;font-weight:bold;background:#f6ebff;border-radius:20px;font-size:32px;border:4px solid transparent}.brush small{display:block;font-size:14px}.brush.active{border-color:#7b59e8;background:#e6ddff}.canvas{height:clamp(290px,48vw,450px);touch-action:none;user-select:none;cursor:crosshair}.stamp{position:absolute;user-select:none;pointer-events:none;transform:translate(-50%,-50%);animation:pop .22s ease;font-size:clamp(30px,5vw,58px)}@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes swing{50%{transform:rotate(10deg) translateY(9px)}}@keyframes bob{50%{transform:translateY(-15px)}}.floating{display:inline-block;animation:bob 2s infinite ease-in-out}.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:650px;margin:25px auto}.pad{padding:30px 5px;border-radius:32px;font-size:clamp(40px,8vw,80px);box-shadow:0 9px 0 #c1e0e7;transition:transform .1s;background:#e4f7ff;min-height:145px}.pad:nth-child(2){background:#e8dcff}.pad:nth-child(3){background:#fff1b0}.pad:active,.pad.lit{transform:scale(.92);filter:saturate(1.8);box-shadow:0 3px 0 #bbb}.pad b{display:block;font-size:clamp(16px,3vw,25px)}.thermo{max-width:730px;margin:22px auto}.thermo input{width:100%;height:32px;accent-color:#f25f59;cursor:pointer}.thermo .labels{display:flex;justify-content:space-between;font-weight:900;font-size:22px}.weather-scene{display:flex;justify-content:center;align-items:center;gap:20px;height:250px;font-size:clamp(58px,11vw,120px);transition:background .5s}.maze{display:grid;grid-template-columns:repeat(5,1fr);max-width:510px;margin:auto;gap:5px}.cell{display:flex;justify-content:center;align-items:center;aspect-ratio:1;background:#e0f4fb;border-radius:13px;font-size:clamp(23px,5.7vw,50px)}.cell.wall{background:#91c3e2}.dpad{display:grid;grid-template-columns:repeat(3,70px);gap:7px;justify-content:center;margin:18px auto}.dpad button{width:70px;height:58px;border-radius:20px;background:#ffe28b;font-size:32px;box-shadow:0 4px #ddae51}.season{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;height:300px;transition:background .5s}.season-art{font-size:clamp(66px,12vw,130px);animation:bob 2s ease-in-out infinite}.season-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.season-buttons button{min-height:92px;border-radius:24px;background:#f3eaff;font-size:clamp(24px,5vw,45px);font-weight:900}.season-buttons button small{display:block;font-size:clamp(12px,2vw,18px)}.season-buttons button.active{background:#ffe88a;outline:4px solid #ecb636}.movie{height:330px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;transition:background 1s}.movie .world{font-size:clamp(72px,13vw,130px);animation:bob 2s infinite}.movie .caption{font-size:clamp(22px,4vw,33px);font-weight:1000;padding:10px 15px;border-radius:18px;background:#ffffffde;max-width:90%}.progress{display:flex;gap:7px;justify-content:center;margin-top:13px}.progress i{height:10px;width:52px;border-radius:10px;background:#c8dfe6}.progress i.done{background:#f7bf45}footer{text-align:center;padding:28px 10px;color:#406783;font-weight:700}#notice{min-height:30px;font-weight:900;color:#a53674;margin:13px auto;font-size:20px}@media(max-width:560px){.wrap{padding:10px}.top{gap:5px}.pill{font-size:13px;padding:8px}.pane{min-height:450px}.gamecard{min-height:160px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gamecard{padding:14px;border-radius:22px}.gamecard strong{font-size:17px}.gamecard small{font-size:13px}.gamecard .emoji{font-size:39px}.season-buttons button{min-height:72px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><span>☁️🌈</span> Sky Explorers</div><div style="display:flex;flex-wrap:wrap;gap:9px"><span class="pill" id="starCount">⭐ 0 stars</span><button class="btn" id="voice" onclick="toggleVoice()">🔊 Voice ON</button></div></div><main id="app"></main><footer>Made for Teacher Görkem 🌟 · English • Ages 4–5</footer></div><script>
let stars=0;try{stars=+(localStorage.getItem('sky-stars')||0)}catch(e){};let voiceOn=true,game='', timers=[],paintEmoji='☀️',paintMoves=0, rainbowStep=0,rainbowRound=1,beatPattern=[],beatIndex=0,beatBusy=false,beatLevel=1,temperatureLevel=0,tempTargets=[],tempValue=50,mazeLayout=0,mazePos=0,seasonTarget=0,seasonRounds=0,seasonCurrent=0,movieScene=0,moviePlaying=false;let movieTimer=null,audioCtx=null;
const E=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);function updateStars(){E('starCount').textContent='⭐ '+stars+' stars';try{localStorage.setItem('sky-stars',String(stars))}catch(e){}}function award(n=1){stars+=n;updateStars();}function speak(t){if(!voiceOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.79;u.pitch=1.09;let vv=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));if(vv.length)u.voice=vv.find(v=>/samantha|google us|english/i.test(v.name))||vv[0];speechSynthesis.speak(u)}catch(e){}}function toggleVoice(){voiceOn=!voiceOn;E('voice').textContent=voiceOn?'🔊 Voice ON':'🔇 Voice OFF';if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel()}function clearTimers(){timers.forEach(clearTimeout);timers=[];if(movieTimer){clearInterval(movieTimer);movieTimer=null;}moviePlaying=false;if('speechSynthesis' in window)speechSynthesis.cancel()}function later(fn,ms){timers.push(setTimeout(fn,ms))}function notice(s){let x=E('notice');if(x)x.textContent=s}function shell(title,instruction,inner){E('app').innerHTML=`<section class="pane"><div class="controls" style="justify-content:space-between"><button class="btn" onclick="home()">⬅ Games</button><span class="pill">🌦️ Weather & Seasons</span><button class="btn" onclick="speak(${JSON.stringify(instruction).replace(/"/g,'&quot;')})">🔊 Listen</button></div><h2>${title}</h2><p class="instructions">${instruction}</p>${inner}<div id="notice" aria-live="polite"></div></section>`}function home(){clearTimers();game='';E('app').innerHTML=`<section class="hero"><div class="mega">🌈🧸☀️</div><h1>Sky Explorers</h1><p>Play, move, listen, and learn English!</p><button class="btn primary" onclick="speak('Hello, sky explorers! Choose your game!')">🔊 Say Hello!</button></section><section class="grid">${[['painter','🎨','Magic Sky Painter','Draw your own weather!'],['rainbow','🌈','Rainbow Rescue','Make a beautiful rainbow!'],['beat','🥁','Weather Beat Band','Listen and repeat the rhythm!'],['temperature','🌡️','Thermometer Lab','Make it hot or cold!'],['maze','🏰','Cloud Castle Maze','Find the rainbow gate!'],['seasons','🌸','Seasons Time Machine','Change the seasons!'],['movie','🎬','Weather Movie','Watch our animated weather story!']].map(a=>`<button class="gamecard" onclick="openGame('${a[0]}')"><span class="emoji">${a[1]}</span><strong>${a[2]}</strong><small>${a[3]}</small></button>`).join('')}</section>`}function openGame(g){clearTimers();game=g;({painter:startPainter,rainbow:startRainbow,beat:startBeat,temperature:startTemperature,maze:startMaze,seasons:startSeasons,movie:startMovie})[g]();}
// Painter
const brushes=[['☀️','Sunny'],['🌧️','Rainy'],['❄️','Snowy'],['☁️','Cloudy'],['🍃','Windy']];function startPainter(){paintEmoji='☀️';paintMoves=0;shell('🎨 Magic Sky Painter','Choose a brush. Paint the sky!',`<div class="controls" id="brushes">${brushes.map(([e,n])=>`<button class="brush ${e==='☀️'?'active':''}" data-emoji="${e}" onclick="chooseBrush('${e}',this)">${e}<small>${n}</small></button>`).join('')}</div><div class="scene canvas" id="canvas" aria-label="Draw the weather here" style="background:linear-gradient(#9ddfff,#dff7ff)"></div><div class="controls"><button class="btn blue" onclick="E('canvas').innerHTML='';notice('A fresh sky!')">🧹 Clear</button><button class="btn primary" onclick="surpriseSky()">✨ Surprise Sky</button></div>`);let c=E('canvas');c.addEventListener('pointerdown',drawStamp);c.addEventListener('pointermove',e=>{if(e.buttons&&paintMoves++%3===0)drawStamp(e)})}function chooseBrush(e,button){paintEmoji=e;document.querySelectorAll('.brush').forEach(b=>b.classList.remove('active'));button.classList.add('active');speak(brushes.find(x=>x[0]===e)[1])}function drawStamp(e){let c=E('canvas');if(!c)return;let b=c.getBoundingClientRect();let x=(e.clientX-b.left)/b.width*100,y=(e.clientY-b.top)/b.height*100;if(x<0||x>100||y<0||y>100)return;let s=document.createElement('span');s.className='stamp';s.textContent=paintEmoji;s.style.left=x+'%';s.style.top=y+'%';c.appendChild(s);if(c.children.length>45)c.removeChild(c.firstChild);if(c.children.length===8){award();notice('Amazing artist! ⭐');speak('Amazing artist!')}}function surpriseSky(){let c=E('canvas');c.innerHTML='';for(let j=0;j<22;j++){let s=document.createElement('span');s.className='stamp';s.textContent=pick(brushes)[0];s.style.left=(5+Math.random()*90)+'%';s.style.top=(7+Math.random()*85)+'%';c.appendChild(s)}award();notice('WOW! Beautiful sky!');speak('Wow! Beautiful sky!')}
// Rainbow
function startRainbow(){rainbowRound=1;rainbowStep=0;renderRainbow()}function renderRainbow(){let instruction=rainbowStep===0?'Tap the CLOUD to make rain!':rainbowStep===1?'Now tap the SUN!':'Look! A rainbow!';let visual=rainbowStep===0?'☁️':rainbowStep===1?'🌧️ ☀️':'🌈';shell('🌈 Rainbow Rescue',instruction,`<div class="scene" style="min-height:330px;background:${rainbowStep===2?'linear-gradient(#c4eefe,#ffe6ad)':'linear-gradient(#9fd9f7,#eef7ff)'};display:flex;flex-direction:column;justify-content:center;align-items:center"><div class="mega floating">${visual}</div>${rainbowStep<2?`<button class="btn primary" onclick="rainbowTap()" style="font-size:28px;margin:12px">${rainbowStep===0?'☁️ Tap the Cloud':'☀️ Tap the Sun'}</button>`:`<div class="celebrate">Great job! 🌟</div>`}</div><div class="controls"><span class="pill">Scene ${rainbowRound} of 3</span>${rainbowStep===2?`<button class="btn primary" onclick="nextRainbow()">${rainbowRound===3?'Play Again':'Next Scene'} ➡</button>`:''}</div>`)}function rainbowTap(){if(rainbowStep===0){rainbowStep=1;renderRainbow();speak('Rain, rain, rain! Now we need sunshine!')}else{rainbowStep=2;renderRainbow();award(2);speak('Sun and rain make a rainbow! Great job!')}}function nextRainbow(){rainbowRound=rainbowRound===3?1:rainbowRound+1;rainbowStep=0;renderRainbow()}
// Beat game
function soundBeat(idx){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=idx===0?'sine':idx===1?'triangle':'sine';osc.frequency.setValueAtTime([390,180,650][idx],now);osc.frequency.exponentialRampToValueAtTime([240,80,950][idx],now+.24);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.15,now+.02);gain.gain.exponentialRampToValueAtTime(.001,now+.32);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+.35)}catch(e){}}function startBeat(){beatLevel=1;newBeat()}function newBeat(){beatPattern=Array.from({length:Math.min(beatLevel+1,4)},()=>Math.floor(Math.random()*3));beatIndex=0;beatBusy=false;renderBeat()}function renderBeat(){shell('🥁 Weather Beat Band','Listen. Then copy the beat!',`<div class="controls"><span class="pill">Level ${beatLevel}</span><button class="btn primary" onclick="playBeat()">▶ Listen to the Beat</button><button class="btn" onclick="newBeat()">🔁 New Beat</button></div><div class="pads">${[['🌧️','Rain'],['🍃','Wind'],['☀️','Sun']].map((a,i)=>`<button id="pad${i}" class="pad" onclick="tapBeat(${i})">${a[0]}<b>${a[1]}</b></button>`).join('')}</div><div class="stars" id="beatProgress">${'○ '.repeat(beatPattern.length)}</div>`)}function flashPad(i){let el=E('pad'+i);if(!el)return;el.classList.add('lit');soundBeat(i);later(()=>el?.classList.remove('lit'),300)}function playBeat(){if(beatBusy)return;beatBusy=true;beatIndex=0;notice('Listen carefully!');beatPattern.forEach((x,i)=>later(()=>flashPad(x),500+i*680));later(()=>{beatBusy=false;notice('Your turn!');speak('Your turn!')},600+beatPattern.length*680)}function tapBeat(i){if(beatBusy)return;flashPad(i);if(i!==beatPattern[beatIndex]){beatIndex=0;notice('Try again! Listen one more time.');speak('Try again!');return}beatIndex++;let progress=E('beatProgress');if(progress)progress.textContent='⭐ '.repeat(beatIndex)+'○ '.repeat(beatPattern.length-beatIndex);if(beatIndex===beatPattern.length){beatBusy=true;award(2);notice('Perfect rhythm! ⭐');speak('Perfect rhythm!');later(()=>{beatLevel=beatLevel%4+1;newBeat()},1300)}}
// Temperature
const thermometerTargets=[['COLD',0,30,'🥶❄️'],['WARM',35,65,'🙂🌤️'],['HOT',70,100,'🥵☀️']];function startTemperature(){temperatureLevel=0;tempTargets=shuffle([0,1,2,0,2]);newTemp()}function newTemp(){tempValue=50;let target=thermometerTargets[tempTargets[temperatureLevel]];shell('🌡️ Thermometer Lab',`Make it ${target[0]}!`,`<div class="scene weather-scene" id="weatherScene" style="background:linear-gradient(#cce8fd,#edfaff)"><span id="thermoArt" class="mega">🌤️</span><span id="thermoState" style="font-size:30px;font-weight:900">WARM</span></div><div class="thermo"><div class="labels"><span>🥶 COLD</span><span>😊 WARM</span><span>🥵 HOT</span></div><input type="range" min="0" max="100" value="50" step="1" oninput="changeTemp(this.value)" aria-label="Temperature"></div><div class="controls"><span class="pill">Challenge ${temperatureLevel+1} / 5</span><button class="btn primary" onclick="checkTemp()">✅ Check!</button><button class="btn blue" onclick="startTemperature()">🔁 Restart</button></div>`)}function changeTemp(v){tempValue=+v;let category=tempValue<33?0:tempValue<68?1:2,scene=E('weatherScene');if(scene){scene.style.background=['linear-gradient(#a9dfff,#fff)','#dff9fb','linear-gradient(#ffca71,#fff1bc)'][category];E('thermoArt').textContent=['🧊❄️','🌤️🌷','☀️💧'][category];E('thermoState').textContent=['COLD','WARM','HOT'][category]}}function checkTemp(){let target=thermometerTargets[tempTargets[temperatureLevel]];if(tempValue>=target[1]&&tempValue<=target[2]){award();notice('Excellent! '+target[0]+'!');speak('Excellent!');later(()=>{temperatureLevel++;if(temperatureLevel>=5){temperatureLevel=0;tempTargets=shuffle([0,1,2,0,2]);}newTemp()},1100)}else{notice('Try again! Move the thermometer.');speak('Try again!')}}
// Maze
const mazes=[new Set([3,8,13,18,20,21]),new Set([3,6,11,16,17,18]),new Set([5,6,7,12,17,22])];function startMaze(){mazeLayout=Math.floor(Math.random()*3);mazePos=0;renderMaze()}function renderMaze(){shell('🏰 Cloud Castle Maze','Find the rainbow gate!',`<div class="maze" id="maze">${Array.from({length:25},(_,i)=>`<div class="cell ${mazes[mazeLayout].has(i)?'wall':''}">${i===mazePos?'🐻':i===24?'🌈':mazes[mazeLayout].has(i)?'☁️':''}</div>`).join('')}</div><div class="dpad"><span></span><button aria-label="Up" onclick="moveMaze(-5)">⬆</button><span></span><button aria-label="Left" onclick="moveMaze(-1)">⬅</button><button aria-label="Down" onclick="moveMaze(5)">⬇</button><button aria-label="Right" onclick="moveMaze(1)">➡</button></div><button class="btn blue" onclick="startMaze()">🔄 New Maze</button>`)}function moveMaze(delta){if(game!=='maze')return;let next=mazePos+delta;if(next<0||next>24||mazes[mazeLayout].has(next))return;if(Math.abs(delta)===1&&Math.floor(next/5)!==Math.floor(mazePos/5))return;mazePos=next;let grid=E('maze');if(grid){[...grid.children].forEach((c,i)=>{c.textContent=i===mazePos?'🐻':i===24?'🌈':mazes[mazeLayout].has(i)?'☁️':''})}if(mazePos===24){award(3);notice('You found the rainbow! 🎉');speak('You found the rainbow!');later(()=>startMaze(),1500)}}document.addEventListener('keydown',e=>{if(game!=='maze')return;let d={ArrowUp:-5,ArrowDown:5,ArrowLeft:-1,ArrowRight:1}[e.key];if(d){e.preventDefault();moveMaze(d)}});
// Seasons
const SS=[['SPRING','🌷🦋🌼','linear-gradient(#c8f3e4,#dcf8bf)'],['SUMMER','☀️🌻🏖️','linear-gradient(#ffe68a,#ccf9fe)'],['AUTUMN','🍂🍁🌰','linear-gradient(#ffd19a,#f3d1a1)'],['WINTER','❄️☃️🌲','linear-gradient(#c1e6ff,#ffffff)']];function startSeasons(){seasonRounds=0;seasonCurrent=0;seasonTarget=Math.floor(Math.random()*4);renderSeasons()}function renderSeasons(){let s=SS[seasonCurrent];shell('🌸 Seasons Time Machine',`Show me ${SS[seasonTarget][0]}!`,`<div class="scene season" id="seasonScene" style="background:${s[2]}"><div class="season-art" id="seasonArt">${s[1]}</div><div style="font-size:clamp(28px,5vw,46px);font-weight:1000" id="seasonName">${s[0]}</div></div><div class="season-buttons">${SS.map((x,i)=>`<button class="${i===seasonCurrent?'active':''}" onclick="chooseSeason(${i})">${x[1]}<small>${x[0]}</small></button>`).join('')}</div><div class="controls"><span class="pill">Round ${seasonRounds+1} of 6</span><button class="btn blue" onclick="startSeasons()">🔁 Replay</button></div>`)}function chooseSeason(i){seasonCurrent=i;let s=SS[i];E('seasonScene').style.background=s[2];E('seasonArt').textContent=s[1];E('seasonName').textContent=s[0];document.querySelectorAll('.season-buttons button').forEach((b,j)=>b.classList.toggle('active',i===j));speak(s[0].toLowerCase());if(i===seasonTarget){award();notice('Yes! '+s[0]+'! ⭐');seasonRounds++;later(()=>{seasonTarget=Math.floor(Math.random()*4);if(seasonRounds===6){seasonRounds=0;notice('You are a Seasons Star!')}renderSeasons()},1400)}else notice('Explore and try again!')}
// Movie
const MOV=[['☀️🏡🌼','It is a sunny day!','linear-gradient(#ffefa1,#cff5ff)'],['🌬️🍂🌳','The wind is blowing!','linear-gradient(#ccedfb,#e7f5ec)'],['☁️🌧️☔','Oh! It is raining!','linear-gradient(#a4c9e0,#d6e9f5)'],['🌈🐻🌷','Look! A beautiful rainbow!','linear-gradient(#ffe3bc,#b8edff)']];function startMovie(){movieScene=0;moviePlaying=false;renderMovie()}function renderMovie(){let m=MOV[movieScene];shell('🎬 Weather Movie','Watch the weather change!',`<div class="scene movie" id="movieScene" style="background:${m[2]}"><div class="world" id="movieWorld">${m[0]}</div><div class="caption" id="movieCaption">${m[1]}</div></div><div class="progress" id="movieProgress">${MOV.map((x,i)=>`<i class="${i<=movieScene?'done':''}"></i>`).join('')}</div><div class="controls"><button class="btn primary" id="moviePlay" onclick="playMovie()">▶ Play</button><button class="btn blue" onclick="pauseMovie()">⏸ Pause</button><button class="btn pink" onclick="replayMovie()">⟲ Replay</button></div><p class="hint">An original in-app animated mini story with English captions.</p>`)}function setMovie(i){movieScene=i;let m=MOV[i];E('movieWorld').textContent=m[0];E('movieCaption').textContent=m[1];E('movieScene').style.background=m[2];E('movieProgress').innerHTML=MOV.map((x,j)=>`<i class="${j<=i?'done':''}"></i>`).join('');speak(m[1])}function playMovie(){if(moviePlaying)return;moviePlaying=true;E('moviePlay').textContent='▶ Playing';setMovie(movieScene);movieTimer=setInterval(()=>{if(movieScene<3)setMovie(movieScene+1);else{pauseMovie();notice('The End! 🌈');award();}},4800)}function pauseMovie(){if(movieTimer){clearInterval(movieTimer);movieTimer=null}moviePlaying=false;if(E('moviePlay'))E('moviePlay').textContent='▶ Play';if('speechSynthesis' in window)speechSynthesis.cancel()}function replayMovie(){pauseMovie();movieScene=0;setMovie(0);playMovie()}
updateStars();home();
</script></body></html>
